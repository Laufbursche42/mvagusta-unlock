<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-t="pageTitle">Laufbursche MV Agusta Tool</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Laufbursche <span data-t="brandSub"></span></h1>
    <div class="head-right">
      <span class="status" id="status" data-state="disconnected">disconnected</span>
      <div class="head-tools">
        <button type="button" class="theme-btn" id="btn-theme">&#9728;</button>
        <div class="langs" id="langs" role="group">
          <button type="button" data-lang="de" aria-pressed="true">DE</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

  <p class="hint infobox" data-t="infoBannerHtml"></p>

<div class="card">
    <h2 data-t="s1Title"></h2>
    <p class="hint" data-t="sub"></p>
    <p class="hint" data-t="startHintGuide"></p>
    <p class="warn" data-t="expWarn"></p>
    <p class="hint" data-t="ownDevice"></p>
  </div>

  <div class="card">
    <h2 data-t="s2Title"></h2>
    <div class="log-opt">
      <span data-t="showallLabel"></span>
      <input type="checkbox" id="showall">
    </div>
    <div class="btns">
      <button class="primary span2" id="btn-conn" data-act="connect"></button>
    </div>
    <p class="hint" id="devinfo"></p>
    <p class="hint" data-t="controlsHint"></p>
  </div>

  <div class="card" id="live-card" hidden>
    <div class="card-head"><h2 data-t="liveTitle"></h2><button type="button" class="help-btn" data-help="live" aria-label="Info">?</button></div>
    <div class="grid">
      <div class="tile"><b id="t-profile">-</b><small data-t="tileProfile"></small></div>
      <div class="tile"><b id="t-speed">-</b><small data-t="tileSpeed"></small></div>
      <div class="tile"><b id="t-eassist">-</b><small data-t="tileEAssist"></small></div>
      <div class="tile"><b id="t-odo">-</b><small data-t="tileOdo"></small></div>
      <div class="tile"><b id="t-elight">-</b><small data-t="tileELight"></small></div>
      <div class="tile"><b id="t-fault">-</b><small data-t="tileFault"></small></div>
      <div class="tile"><b id="t-kmode">-</b><small data-t="tileKMode"></small></div>
      <div class="tile"><b id="t-cruise">-</b><small data-t="tileCruise"></small></div>
      <div class="tile"><b id="t-lock">-</b><small data-t="tileLock"></small></div>
      <div class="tile"><b id="t-klight">-</b><small data-t="tileKLight"></small></div>
    </div>
    <p class="hint" data-t="liveHint"></p>
    <details class="allframes">
      <summary data-t="allFramesTitle"></summary>
      <div id="all-frames" class="frames"></div>
    </details>
  </div>

  <div class="card" id="batt-card" hidden>
    <div class="card-head"><h2 data-t="battTitle"></h2><button type="button" class="help-btn" data-help="batt" aria-label="Info">?</button></div>
    <div class="grid">
      <div class="tile"><b id="t-batt">-</b><small data-t="tileBatt"></small></div>
      <div class="tile"><b id="t-range">-</b><small data-t="tileRange"></small></div>
    </div>
    <p class="hint" data-t="battHint"></p>
  </div>

  <div class="card" id="more-card" hidden>
    <div class="card-head"><h2 data-t="moreTitle"></h2><button type="button" class="help-btn" data-help="more" aria-label="Info">?</button></div>
    <p class="hint" data-t="moreHint"></p>

    <h3 class="set-group" id="grp-kick-h" data-t="grp_kick"></h3>
    <div class="set-row" data-family="kick" id="row-assist" hidden>
      <label class="set-label"><span data-t="set_assist"></span></label>
      <select id="sel-assist" data-conn disabled>
        <option value="0" data-t="asNone"></option>
        <option value="1" data-t="asEco"></option>
        <option value="2" data-t="asNormal"></option>
        <option value="3" data-t="asSport"></option>
      </select>
      <button type="button" id="btn-assist" data-t="btnSet" data-conn disabled></button>
    </div>
    <div class="set-row" data-family="kick" id="row-cruise" hidden>
      <label class="set-label"><span data-t="set_cruise"></span></label>
      <select id="sel-cruise" data-conn disabled>
        <option value="0" data-t="valOff"></option>
        <option value="1" data-t="valOn"></option>
      </select>
      <button type="button" id="btn-cruise" data-t="btnSet" data-conn disabled></button>
    </div>
    <div class="set-row" data-family="kick" id="row-klight" hidden>
      <label class="set-label"><span data-t="set_klight"></span></label>
      <select id="sel-klight" data-conn disabled>
        <option value="0" data-t="valOff"></option>
        <option value="1" data-t="valOn"></option>
      </select>
      <button type="button" id="btn-klight" data-t="btnSet" data-conn disabled></button>
    </div>
    <div class="set-row" data-family="kick" id="row-lock" hidden>
      <label class="set-label"><span data-t="set_lock"></span></label>
      <select id="sel-lock" data-conn disabled>
        <option value="0" data-t="valOpen"></option>
        <option value="1" data-t="valLocked"></option>
      </select>
      <button type="button" id="btn-lock" data-t="btnSet" data-conn disabled></button>
    </div>

    <h3 class="set-group" id="grp-bike-h" data-t="grp_bike"></h3>
    <div class="set-row" data-family="bike" id="row-abs" hidden>
      <label class="set-label"><span data-t="set_abs"></span></label>
      <select id="sel-abs" data-conn disabled>
        <option value="0" data-t="absNormal"></option>
        <option value="1" data-t="absRace"></option>
      </select>
      <button type="button" id="btn-abs" data-t="btnSet" data-conn disabled></button>
    </div>
    <div class="set-row" data-family="bike" id="row-quickshift" hidden>
      <label class="set-label"><span data-t="set_quickshift"></span></label>
      <select id="sel-quickshift" data-conn disabled>
        <option value="0" data-t="qsOff"></option>
        <option value="1" data-t="qsUp"></option>
        <option value="2" data-t="qsUpDown"></option>
      </select>
      <button type="button" id="btn-quickshift" data-t="btnSet" data-conn disabled></button>
    </div>
    <div class="set-row" data-family="bike" id="row-traction" hidden>
      <label class="set-label"><span data-t="set_traction"></span></label>
      <input id="traction-in" type="number" min="0" max="10" step="1" value="0" data-conn disabled>
      <button type="button" id="btn-traction" data-t="btnSet" data-conn disabled></button>
    </div>
    <div class="set-row" data-family="bike" id="row-frontlift" hidden>
      <label class="set-label"><span data-t="set_frontlift"></span></label>
      <select id="sel-frontlift" data-conn disabled>
        <option value="0" data-t="flOff"></option>
        <option value="1" data-t="flOn"></option>
      </select>
      <button type="button" id="btn-frontlift" data-t="btnSet" data-conn disabled></button>
    </div>
    <div class="set-row" data-family="bike" id="row-gas" hidden>
      <label class="set-label"><span data-t="set_gas"></span></label>
      <select id="sel-gas" data-conn disabled>
        <option value="0" data-t="gasNormal"></option>
        <option value="1" data-t="gasLow"></option>
        <option value="2" data-t="gasHigh"></option>
      </select>
      <button type="button" id="btn-gas" data-t="btnSet" data-conn disabled></button>
    </div>
    <div class="set-row" data-family="bike" id="row-torque" hidden>
      <label class="set-label"><span data-t="set_torque"></span></label>
      <select id="sel-torque" data-conn disabled>
        <option value="0" data-t="tqFull"></option>
        <option value="2" data-t="tqMedium"></option>
        <option value="1" data-t="tqLow"></option>
      </select>
      <button type="button" id="btn-torque" data-t="btnSet" data-conn disabled></button>
    </div>
    <div class="set-row" data-family="bike" id="row-engresp" hidden>
      <label class="set-label"><span data-t="set_engresp"></span></label>
      <select id="sel-engresp" data-conn disabled>
        <option value="0" data-t="erFast"></option>
        <option value="1" data-t="erSlow"></option>
      </select>
      <button type="button" id="btn-engresp" data-t="btnSet" data-conn disabled></button>
    </div>
    <div class="set-row" data-family="bike" id="row-rpm" hidden>
      <label class="set-label"><span data-t="set_rpm"></span></label>
      <select id="sel-rpm" data-conn disabled>
        <option value="0" data-t="rpmSoft"></option>
        <option value="1" data-t="rpmHard"></option>
      </select>
      <button type="button" id="btn-rpm" data-t="btnSet" data-conn disabled></button>
    </div>
  </div>

  <div class="card" id="raw-card" hidden>
    <div class="card-head"><h2 data-t="rawTitle"></h2><button type="button" class="help-btn" data-help="raw" aria-label="Info">?</button></div>
    <p class="hint" data-t="rawHint"></p>

    <div id="build-sub" hidden>
      <h3 class="set-group" data-t="grp_build"></h3>
      <div class="speed-values">
        <div class="sv"><label data-t="lblOpcode"></label><input id="build-op-in" type="text" maxlength="2" value="8A" data-conn disabled></div>
        <div class="sv"><label data-t="lblParam"></label><input id="build-param-in" type="number" min="0" max="255" step="1" value="16" data-conn disabled></div>
        <div class="sv"><label data-t="lblValue"></label><input id="build-val-in" type="number" min="0" max="255" step="1" value="1" data-conn disabled></div>
      </div>
      <div class="btns">
        <button type="button" class="primary span2" id="btn-build" data-t="btnSend" data-conn disabled></button>
      </div>
      <p class="hint" data-t="buildHint"></p>
    </div>

    <h3 class="set-group" data-t="grp_raw"></h3>
    <div class="set-row">
      <label class="set-label"><span data-t="lblRaw"></span></label>
      <input id="raw-in" type="text" data-t-ph="rawPh" data-conn disabled>
      <button type="button" id="btn-raw" data-t="btnSend" data-conn disabled></button>
    </div>

    <h3 class="set-group" data-t="grp_ascii"></h3>
    <div class="set-row">
      <label class="set-label"><span data-t="lblFree"></span></label>
      <input id="free-in" type="text" data-t-ph="freePh" data-conn disabled>
      <button type="button" id="btn-free" data-t="btnSend" data-conn disabled></button>
    </div>
  </div>

  <div class="card">
    <h2 data-t="s6Title"></h2>
    <div class="log-opts">
      <div class="log-opt">
        <span data-t="publicLogLabel"></span>
        <input type="checkbox" id="public-log" checked>
        <button type="button" class="help-btn" data-help="publiclog" aria-label="Info">?</button>
      </div>
      <div class="log-opt">
        <span data-t="diagLogLabel"></span>
        <input type="checkbox" id="diag-log">
        <button type="button" class="help-btn" data-help="diaglog" aria-label="Info">?</button>
      </div>
    </div>
    <div class="btns">
      <button type="button" id="btn-copy-log" data-t="btnCopyLog"></button>
      <button type="button" id="btn-clear-log" data-t="btnClearLog"></button>
      <button type="button" id="btn-save-log" class="span2" data-t="btnSaveLog"></button>
    </div>
    <pre id="log"></pre>
    <p class="hint"><span class="log-tx" data-t="logTxLegend"></span>, <span class="log-rx" data-t="logRxLegend"></span></p>
  </div>

  <footer class="foot">
    <span class="foot-links">
      <a id="link-guide" href="GUIDE.de.md" data-doc="GUIDE" data-t="footGuide"></a>
      <a href="https://github.com/Laufbursche42/mvagusta-unlock" target="_blank" rel="noopener" data-t="footSource"></a>
      <a id="link-readme" href="README.md" data-doc="README" data-t="footReadme"></a>
      <a id="link-disclaimer" href="#" data-t="footDisclaimer"></a>
      <a id="link-license" href="LICENSE.de.md" data-doc="LICENSE" data-t="footLicense"></a>
      <a id="link-privacy" href="PRIVACY.de.md" data-doc="PRIVACY" data-t="footPrivacy"></a>
      <a id="link-trademarks" href="TRADEMARKS.de.md" data-doc="TRADEMARKS" data-t="footTrademarks"></a>
    </span>
    <span class="foot-links"><span class="ver" id="build-ver"></span><a href="https://github.com/Laufbursche42/Laufbursche42/issues" target="_blank" rel="noopener" data-t="footIssue"></a></span>
    <a class="foot-copy" href="https://laufbursche42.github.io/Laufbursche42/" target="_blank" rel="noopener">Copyright (c) 2026 Laufbursche</a>
  </footer>
</div>

<dialog id="doc" aria-labelledby="doc-title">
  <div class="doc-head">
    <h3 id="doc-title"></h3>
    <button type="button" id="doc-x">&times;</button>
  </div>
  <div class="doc-body" id="doc-body"></div>
  <div class="doc-foot">
    <button type="button" id="doc-close" data-t="docClose"></button>
  </div>
</dialog>

<dialog id="help" aria-labelledby="help-title">
  <div class="doc-head">
    <h3 id="help-title"></h3>
    <button type="button" id="help-x">&times;</button>
  </div>
  <div class="doc-body"><p id="help-body"></p></div>
  <div class="doc-foot">
    <button type="button" id="help-close" data-t="docClose"></button>
  </div>
</dialog>

<dialog id="confirm" aria-labelledby="confirm-title">
  <div class="doc-head">
    <h3 id="confirm-title" data-t="confirmTitle"></h3>
    <button type="button" id="confirm-x">&times;</button>
  </div>
  <div class="doc-body"><p id="confirm-body"></p></div>
  <div class="doc-foot">
    <button type="button" id="confirm-no" data-t="confirmCancel"></button>
    <button type="button" id="confirm-ok" class="primary" data-t="confirmOk"></button>
  </div>
</dialog>

<script src="report-footer.js?v=3"></script>
<script src="i18n.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
